<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Juan José Robalino — Ingeniero Biomédico</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#F4F6F7;
    --surface:#FFFFFF;
    --ink:#12262B;
    --muted:#57696E;
    --accent:#0F766E;
    --accent-press:#0B5A54;
    --hairline:#DDE4E5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 20px;
  }
  .card{
    width:100%;
    max-width:400px;
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:16px;
    padding:32px 28px 26px;
    animation:enter .5s ease both;
  }
  @media (prefers-reduced-motion:reduce){ .card{animation:none;} }
  @keyframes enter{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:none;} }

  .rule{height:3px;width:44px;background:var(--accent);border-radius:2px;margin-bottom:22px;}

  .name{
    font-family:"IBM Plex Serif",Georgia,serif;
    font-weight:600;
    font-size:27px;
    line-height:1.15;
    letter-spacing:-.2px;
    margin:0;
  }
  .title{
    font-size:15px;
    color:var(--muted);
    margin:8px 0 0;
    font-weight:500;
  }
  .position{
    font-size:14px;
    color:var(--accent);
    font-weight:600;
    margin:14px 0 0;
    line-height:1.45;
  }

  .actions{margin-top:26px;display:flex;flex-direction:column;gap:11px;}
  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    width:100%;
    padding:15px 16px;
    border-radius:11px;
    font-size:15px;
    font-weight:600;
    font-family:inherit;
    text-decoration:none;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .12s ease,border-color .12s ease,transform .05s ease;
  }
  .btn:active{transform:scale(.99);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:active{background:var(--accent-press);}
  .btn-outline{background:transparent;color:var(--ink);border-color:var(--hairline);}
  .btn-outline:active{background:#F0F3F3;}
  .btn svg{width:18px;height:18px;flex:0 0 auto;}

  .contact{
    margin-top:26px;
    padding-top:20px;
    border-top:1px solid var(--hairline);
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .contact a,.contact span{
    display:flex;
    align-items:center;
    gap:11px;
    color:var(--ink);
    text-decoration:none;
    font-size:14px;
  }
  .contact svg{width:16px;height:16px;color:var(--muted);flex:0 0 auto;}
  .contact a:active{color:var(--accent);}
</style>
</head>
<body>
  <main class="card">
    <div class="rule" aria-hidden="true"></div>
    <h1 class="name">Juan José Robalino Romo Leroux</h1>
    <p class="title">Ingeniero Biomédico</p>
    <p class="position">Diseño de dispositivos médicos · Prótesis y R&amp;D</p>

    <div class="actions">
      <button class="btn btn-primary" id="save">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        Guardar contacto
      </button>
      <a class="btn btn-outline" id="cv" href="./CV_JJRobalino_General_ES.pdf" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        Ver CV
      </a>
      <a class="btn btn-outline" href="https://linkedin.com/in/jnjs" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14zM8.34 17V9.99H6.02V17h2.32zM7.18 8.9a1.35 1.35 0 1 0 0-2.7 1.35 1.35 0 0 0 0 2.7zM18 17v-3.85c0-2.06-1.1-3.02-2.57-3.02-1.19 0-1.72.65-2.02 1.11V9.99h-2.32c.03.66 0 7.01 0 7.01h2.32v-3.92c0-.21.02-.42.08-.57.16-.42.55-.86 1.19-.86.84 0 1.18.64 1.18 1.58V17H18z"/></svg>
        LinkedIn
      </a>
    </div>

    <div class="contact">
      <a href="mailto:juanjose.robalino237@gmail.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
        juanjose.robalino237@gmail.com
      </a>
      <a href="tel:+593984978025">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        +593 98 497 8025
      </a>
      <span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        Quito, Ecuador
      </span>
    </div>
  </main>

<script>
  const vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:Robalino Romo Leroux;Juan José;;;",
    "FN:Juan José Robalino Romo Leroux",
    "TITLE:Ingeniero Biomédico",
    "EMAIL;TYPE=INTERNET:juanjose.robalino237@gmail.com",
    "TEL;TYPE=CELL:+593984978025",
    "ADR;TYPE=HOME:;;;Quito;;;Ecuador",
    "URL:https://linkedin.com/in/jnjs",
    "NOTE:Ingeniero Biomédico — Diseño de dispositivos médicos, prótesis y R&D",
    "END:VCARD"
  ].join("\r\n");

  document.getElementById("save").addEventListener("click", function () {
    const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Juan_Jose_Robalino.vcf";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  });
</script>
</body>
</html>
